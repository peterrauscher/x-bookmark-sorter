<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>BookmarX — Popup</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 28 28" aria-hidden="true">
        <path d="M6 3.5A2.5 2.5 0 0 1 8.5 1h11A2.5 2.5 0 0 1 22 3.5v22a.75.75 0 0 1-1.22.58L14 20.8 7.22 26.08A.75.75 0 0 1 6 25.5V3.5z" fill="#0f1419"/>
        <path d="M10 8h8M10 12h8M10 16h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="brand-title">BookmarX</span>
    </div>
    <button id="settingsBtn" class="icon-button" title="Open settings" aria-label="Open settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </header>
  <div class="actions">
    <button id="scanBtn" class="button-action button-scan">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
      <span>Scan bookmarks</span>
    </button>
    <button id="sortBtn" class="button-action button-sort">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"/>
        <path d="M19 5h4"/>
        <path d="M21 3v4"/>
      </svg>
      <span>Auto-sort with X</span>
    </button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <nav id="tabs" class="filter-pills" aria-label="Bookmark filters"></nav>
  <main id="list"></main>
  <script src="popup.js"></script>
</body>
</html>
